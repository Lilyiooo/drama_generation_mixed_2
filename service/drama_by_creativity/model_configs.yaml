# 模型配置文件
# 统一管理所有LLM模型调用配置，方便后续统一调整
# 修改对应模型的 model 字段即可切换该类任务使用的模型

# ============================================================
# 生成类模型（按任务类型细分）
# ============================================================

# 世界观生成模型
world_view_model:
  model: "qwen-local"
  system_prompt: "You are an AI assistant that helps people find information."
  temperature: 1.0
  top_p: 1
  top_k: 50
  max_length: 64000
  max_new_tokens: 16384

# 人设生成模型
