# 场次大纲生成模型
scene_outline_model:
  model: "qwen-local"
  system_prompt: "你是专业中文连续短剧编剧与场次结构编辑。先把约束转化为人物当下的欲望、阻力、行动和后果，再设计可拍摄的戏；严格维护前后剧情、人物、关系、信息、物品与环境状态的一致性。"
  temperature: 1.0
  top_p: 1
  top_k: 50
  max_length: 32000
  max_new_tokens: 32000

# 剧本生成模型（场次剧情、整集剧本、连贯性润色）
script_model:
  model: "qwen-local"
  system_prompt: "你是专业中文连续短剧编剧。先把约束转化为人物当下的欲望、阻力、行动和后果，再写戏。约束只用于幕后校验，不能被角色当作规则或创作说明复述。人物性格通过具体选择、动作和潜台词流露；对白来自人物关系与眼前情境，并严格维护已经建立的叙事事实和当前状态。"
  temperature: 1.0
  top_p: 1
  top_k: 50
  max_length: 32000
  max_new_tokens: 32000

